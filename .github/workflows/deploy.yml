name: Deploy DoodlePad to Server

on:
  push:
    branches:
      - liveServer

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting Deployment..."

            # ============================================================
            # 1. BACKEND DEPLOY
            # ============================================================
            cd ~/Doodlepad/DoodlePad

            echo "📥 Pulling latest code..."
            git fetch origin
            git checkout liveServer
            git reset --hard origin/liveServer

            # 🔥 Firebase config protect karo — git reset se overwrite na ho
            cat > ~/Doodlepad/DoodlePad/server/src/config/firebase.js << 'FIREBASE_EOF'
            import admin from "firebase-admin";
            if (!admin.apps.length) {
              admin.initializeApp({
                credential: admin.credential.applicationDefault(),
                projectId: "doodlepad-dc0df",
                storageBucket: "doodlepad-media-staging"
              });
            }
            const bucket = admin.storage().bucket("doodlepad-media-staging");
            const auth = admin.auth();
            export { admin, bucket, auth };
            export default admin;
            FIREBASE_EOF

            echo "📦 Installing backend dependencies..."
            cd ~/Doodlepad/DoodlePad/server
            npm install --omit=dev

            echo "🔄 Restarting PM2..."
            pm2 restart ecosystem.config.cjs || pm2 start ecosystem.config.cjs

            pm2 save

            # ============================================================
            # 2. FRONTEND BUILD & DEPLOY
            # ============================================================
            echo "🏗️ Building frontend..."
            cd ~/Doodlepad/DoodlePad/client
            npm install
            npm run build

            echo "📂 Copying build to Nginx..."
            sudo cp -r dist/* /var/www/doodlepad/

            echo "🔄 Restarting Nginx..."
            sudo systemctl restart nginx

            echo "✅ Deployment Complete!"