# GA
name: Deploy DoodlePad to Server

on:
  push:
    branches:
      - liveServer

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting Deployment..."

            # 1. Aapke GCP server ka sahi path
            cd ~/Doodlepad/DoodlePad/server

            echo "Pulling latest code for liveServer..."
            git fetch origin
            git checkout liveServer
            git reset --hard origin/liveServer

            echo "Installing dependencies..."
            npm install --production

            echo "Restarting PM2..."
            # 2. Aapke PM2 process ka sahi naam (doodlepad-server)
            pm2 restart doodlepad-server || pm2 start server.js --name doodlepad-server

            echo "Saving PM2 process list..."
            pm2 save

            echo "Deployment Completed!"